version: 2
updates:
  # One npm entry, at the root. This is an npm workspace with a single root
  # package-lock.json; Dependabot covers packages/mcp and packages/extension
  # from here and updates that lockfile. The per-package entries this replaces
  # bumped packages/*/package.json WITHOUT the root lockfile, so `npm ci`
  # rejected every PR they opened (#80, #82, #85, #87, #92).
  - package-ecosystem: npm
    directory: "/"
    # Land on stage like every other change; main is prod and is promoted by
    # release overlay. Bumps merged straight to main skipped stage entirely.
    target-branch: stage
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The runtime is Node 20 (Dockerfile node:20-bookworm-slim, engines >=20).
      # Newer majors of the types let code compile against APIs prod lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: stage
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
      include: scope
