name: CI

on:
  pull_request:
    branches: [main, stage, prod]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Build MCP package (required for extension typecheck)
        run: npm --workspace @testrelic/mcp run build
      - run: npm --workspaces run typecheck
      - run: npm --workspaces run build
      - run: npm run copy-config
      - run: npm run update-readme

      - name: Run contract + token-baseline tests
        run: npm test

      - name: Verify README is in sync
        run: |
          if [[ -n "$(git status --porcelain packages/mcp/README.md)" ]]; then
            echo "::error::packages/mcp/README.md is out of date. Run 'npm run update-readme'."
            git diff packages/mcp/README.md
            exit 1
          fi

      # The agent skill's tool inventory is generated from ALL_TOOLS. Without
      # this gate it drifts silently: the hand-maintained version reached 39 of
      # 72 tools, omitting the entire ai/marketplace/apps/artifacts/memory
      # surfaces, and nothing failed.
      - run: npm --workspace @testrelic/mcp run update-skill
      - name: Verify agent skill is in sync
        run: |
          if [[ -n "$(git status --porcelain .agents/skills)" ]]; then
            echo "::error::.agents/skills is out of date. Run 'npm run roll'."
            git diff .agents/skills
            exit 1
          fi

      # Claude Code reads .claude/skills only, so it gets a generated mirror.
      # A hand-edited mirror silently diverges from the source of truth.
      - name: Verify skill mirrors are current
        run: npm --workspace @testrelic/mcp run check-skills

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: testrelic/mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
