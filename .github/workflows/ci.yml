name: CI

on:
  pull_request:
    branches: [main, stage, prod]
  push:
    branches: [main]

# The jobs below install dependencies (running their install scripts) and run
# repository code; they need nothing more than a read-only token.
permissions:
  contents: read

jobs:
  # An infected branch reaches CI the moment it is pushed, and `test` / `docker`
  # execute its build, config and install-time files. Run the guard
  # (testrelic-ai/supply-chain-guard, pinned by commit SHA) first, so repository
  # code never runs on a tree it rejects.
  guard:
    name: Supply-chain guard (CI gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0              # commit-provenance needs the history
          persist-credentials: false  # no token left in .git/config
      - uses: testrelic-ai/supply-chain-guard@0560a2effa3db1886d952774b52639e940684f29 # v1
        with:
          mode: ${{ github.event_name == 'pull_request' && 'pr' || 'push' }}

  test:
    runs-on: ubuntu-latest
    needs: [guard]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Build MCP package (required for extension typecheck)
        run: npm --workspace @testrelic/mcp run build
      - run: npm --workspaces run typecheck
      - run: npm --workspaces run build
      - run: npm run copy-config
      - run: npm run update-readme

      - name: Run contract + token-baseline tests
        run: npm test

      - name: Verify README is in sync
        run: |
          if [[ -n "$(git status --porcelain packages/mcp/README.md)" ]]; then
            echo "::error::packages/mcp/README.md is out of date. Run 'npm run update-readme'."
            git diff packages/mcp/README.md
            exit 1
          fi

      # The agent skill's tool inventory is generated from ALL_TOOLS. Without
      # this gate it drifts silently: the hand-maintained version reached 39 of
      # 72 tools, omitting the entire ai/marketplace/apps/artifacts/memory
      # surfaces, and nothing failed.
      - run: npm --workspace @testrelic/mcp run update-skill
      - name: Verify agent skill is in sync
        run: |
          if [[ -n "$(git status --porcelain .agents/skills)" ]]; then
            echo "::error::.agents/skills is out of date. Run 'npm run roll'."
            git diff .agents/skills
            exit 1
          fi

      # Claude Code reads .claude/skills only, so it gets a generated mirror.
      # A hand-edited mirror silently diverges from the source of truth.
      - name: Verify skill mirrors are current
        run: npm --workspace @testrelic/mcp run check-skills

  docker:
    runs-on: ubuntu-latest
    needs: [guard, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build multi-arch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: testrelic/mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
