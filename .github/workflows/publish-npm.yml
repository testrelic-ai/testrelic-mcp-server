name: Publish npm

# GitHub Environment `prod`: add secret NPM_Publish_Token (npm granular publish token
# with write access to @testrelic/mcp, or classic token if your org policy allows).
# It is exposed to npm as NODE_AUTH_TOKEN on the publish step ONLY. `npm install`
# runs every dependency's install scripts and the build runs repository code, so
# neither of those steps may see the token.
#
# Nothing here runs until the supply-chain guard (testrelic-ai/supply-chain-guard,
# pinned by commit SHA) has passed on the tagged tree.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, run npm publish --dry-run"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  guard:
    name: Supply-chain guard (publish gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0              # commit-provenance needs the history
          persist-credentials: false  # no token left in .git/config
      - uses: testrelic-ai/supply-chain-guard@0560a2effa3db1886d952774b52639e940684f29 # v1
        with:
          mode: ${{ github.event_name == 'push' && 'push' || 'full' }}

  publish:
    runs-on: ubuntu-latest
    needs: [guard]
    environment: prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./packages/mcp/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match packages/mcp version $PKG"
            exit 1
          fi

      - run: npm install --no-audit --no-fund
      - run: npm --workspace @testrelic/mcp run build
      - run: cp LICENSE packages/mcp/LICENSE

      # S1's trained model (dist/tools/triage/tier0-model.js) already leaked onto
      # public npm in 3.5.0, before this guard existed — too late to undo cleanly,
      # so it's accepted as-is (see AUG-15 Jira comment, 2026-11-10). Nothing ELSE
      # may ship this way: these models are private IP, and @testrelic/mcp is a
      # public, unauthenticated package. Add any future per-tier model file here
      # the day it's created, not after it's already published.
      - name: Block private model weights from the public tarball
        run: |
          set -euo pipefail
          FORBIDDEN="tier0-s3-model.js tier0-s4-model.js"
          TARBALL=$(npm pack --workspace @testrelic/mcp --silent)
          FOUND=""
          for f in $FORBIDDEN; do
            if tar -tzf "$TARBALL" | grep -q "dist/tools/triage/$f"; then
              FOUND="$FOUND $f"
            fi
          done
          rm -f "$TARBALL"
          if [ -n "$FOUND" ]; then
            echo "::error::Private model file(s) found in the publishable tarball:$FOUND — these must not ship via public npm. See the AUG-15 decision (2026-11-10): model weights need a private, auth-gated distribution path, not the public npm package."
            exit 1
          fi

      - name: Skip if version already published
        id: skip-check
        run: |
          VER=$(node -p "require('./packages/mcp/package.json').version")
          if npm view "@testrelic/mcp@$VER" version --silent >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@testrelic/mcp@$VER already on npm — skipping publish"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.skip-check.outputs.already_published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_Publish_Token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --workspace @testrelic/mcp --access public --dry-run
          else
            npm publish --workspace @testrelic/mcp --access public --provenance
          fi
