name: Security Gate

# A merge-blocking supply-chain check.
#
# Why this exists as a separate gate rather than trusting what was already here:
# an obfuscated dropper sat in 7 tracked files of `main` for 11 days
# (2026-08-21 -> 2026-09-02) and rode 10 open Dependabot PRs. CodeQL, the test
# suite and the multi-arch docker build passed on every one of them. The
# existing gates are not blind by accident -- they are looking for different
# things -- but nothing was looking for this shape, so nothing found it.
#
# Both jobs now run the canonical guard, testrelic-ai/supply-chain-guard, pinned
# to a commit SHA. The checks execute from that pinned commit, so a pull request
# cannot weaken them by editing a script in this repository (the old in-repo
# scanner could be edited by the very commit it was meant to catch).
#   1. Supply-chain scan  -- injected-payload scan (P1-P8) and lockfile /
#                            registry / install-script / workflow lint (S1-S7)
#   2. Commit provenance  -- C1-C3: a commit whose subject claims a merge must
#                            have 2 parents (how e94a26e reached main unseen),
#                            GitHub- or bot-committed commits must carry a
#                            signature GitHub verifies, no forged force-push replicas
# Exceptions live in .supply-chain-guard.allow, one reviewed entry per line.
#
# The job names "Supply-chain scan" and "Commit provenance" are required status
# checks in the `main` ruleset: do not rename them. The full guard, all three
# tools in one job, runs as "Supply-chain guard" (supply-chain-guard.yml).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply-chain scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # no token left in .git/config

      - name: Scan tracked files, lockfiles, registry config and workflows
        uses: testrelic-ai/supply-chain-guard@94264d5e963e8b60cc08d2a354dd6f2b345bd6a4 # v1
        with:
          mode: full   # no commit range here; provenance is the job below
          checks: P1,P2,P2b,P3,P4,P5,P5b,P6,P7,P8,S1,S2,S3,S4,S5,S6,S7

  commit-provenance:
    name: Commit provenance
    runs-on: ubuntu-latest
    # Only meaningful for a PR, where there is a base..head range to inspect.
    # Pushes are covered by the "Supply-chain guard" job in push mode.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Need real history to read parents; the default shallow clone cannot.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the provenance of the commits this PR introduces
        uses: testrelic-ai/supply-chain-guard@94264d5e963e8b60cc08d2a354dd6f2b345bd6a4 # v1
        with:
          mode: pr     # base.sha..head.sha of the pull request
          checks: C1,C2,C3
