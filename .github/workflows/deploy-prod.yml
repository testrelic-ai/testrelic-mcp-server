name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ vars.MCP_ECR_REPOSITORY }}
  ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
  ECS_SERVICE_NAME: ${{ vars.PROD_MCP_ECS_SERVICE }}
  ECS_TASK_FAMILY: ${{ vars.PROD_MCP_TASK_FAMILY }}
  INGRESS_HOST: ${{ vars.PROD_MCP_HOST }}
  # Capabilities the hosted PROD server registers. Without this the container
  # falls back to config.ts's `["core"]` default, and `ToolRegistry.register`
  # silently skips every gated tool — prod was serving 7 tools while stage
  # served 15, so tr_diagnose_run, tr_ai_rca, tr_suggest_fix, tr_create_jira and
  # the rest simply did not exist for any hosted client. An unregistered tool is
  # not an error the caller can see; it reads as "the tool does nothing".
  # Mirrors MCP_CAPS in deploy-stage.yml. The remaining capabilities
  # (ai, marketplace, apps, artifacts, memory) stay off by design.
  MCP_CAPS: core,coverage,creation,healing,impact,triage,signals,devtools

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # 0a. Guard: which refs may deploy prod
  # ───────────────────────────────────────────────────────────────────────
  # `workflow_dispatch` is deliberately NOT restricted to main, because main's
  # ruleset sets required_deployments: [prod] — a PR cannot merge until prod has
  # been deployed from its branch. A blanket `github.ref == main` guard would
  # therefore deadlock every merge.
  #
  # But unrestricted dispatch is how a stale branch reached prod: on 2026-09-01
  # a run from `ops/deploy-prod-diagnostics` (based on a 2026-05-06 commit,
  # dozens behind main) built that tree and repointed the prod service.
  #
  # The middle ground: allow main, or any branch with an OPEN PR into main.
  # That keeps the pre-merge deploy flow working while refusing arbitrary,
  # abandoned or stale branches.
  guard-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Only main, or a branch with an open PR into main, may deploy prod
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ref is main — allowed"; exit 0
          fi
          OPEN=$(gh pr list --repo "${{ github.repository }}" \
                   --head "${{ github.ref_name }}" --base main \
                   --state open --json number --jq 'length')
          if [ "${OPEN:-0}" -gt 0 ]; then
            echo "branch '${{ github.ref_name }}' has an open PR into main — allowed"; exit 0
          fi
          echo "::error::Refusing to deploy prod from '${{ github.ref_name }}': not main and no open PR into main."
          exit 1

  # ───────────────────────────────────────────────────────────────────────
  # 0b. Resolve environment
  # ───────────────────────────────────────────────────────────────────────
  resolve-environment:
    runs-on: ubuntu-latest
    needs: [guard-ref]
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Set environment name
        id: set-env
        run: echo "environment=prod" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────
  # 1. Build & push MCP image to ECR
  # ───────────────────────────────────────────────────────────────────────
  build-and-push-image:
    runs-on: ubuntu-latest
    needs: [resolve-environment]
    environment: ${{ needs.resolve-environment.outputs.environment }}
    outputs:
      image-tag: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.GH_ACTIONS_ROLE_ARN }}
          role-session-name: GitHubActionsMcpDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/mcp/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:prod-latest

  # ───────────────────────────────────────────────────────────────────────
  # 2. Deploy to ECS
  # ───────────────────────────────────────────────────────────────────────
  deploy-mcp:
    runs-on: ubuntu-latest
    needs: [resolve-environment, build-and-push-image]
    environment: ${{ needs.resolve-environment.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.GH_ACTIONS_ROLE_ARN }}
          role-session-name: GitHubActionsMcpEcsDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Render updated task definition
        id: render-task
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push-image.outputs.image-tag }}"

          aws ecs describe-task-definition \
            --task-definition "${{ env.ECS_TASK_FAMILY }}" \
            --query 'taskDefinition' > /tmp/task-def.json

          # Inject TESTRELIC_MCP_PUBLIC_HOSTS so the server's DNS-rebinding
          # allow-list accepts the CloudFront/nginx-forwarded public Host.
          # Without it the hosted endpoint 403s every POST /mcp (the 3.3.x
          # hardening). Idempotent: drop any prior value, then add the current
          # public host + its new.* preview alias.
          #
          # TESTRELIC_MCP_CAPS is injected the same way — see MCP_CAPS above for
          # why the default `core`-only surface is not what prod should serve.
          jq --arg IMAGE "$IMAGE" --arg HOSTS "${{ env.INGRESS_HOST }},new.${{ env.INGRESS_HOST }}" --arg CAPS "${{ env.MCP_CAPS }}" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
             | .containerDefinitions[0].image = $IMAGE
             | .containerDefinitions[0].environment = ((.containerDefinitions[0].environment // []) | map(select(.name != "TESTRELIC_MCP_PUBLIC_HOSTS")) + [{"name": "TESTRELIC_MCP_PUBLIC_HOSTS", "value": $HOSTS}])
             | .containerDefinitions[0].environment = (.containerDefinitions[0].environment | map(select(.name != "TESTRELIC_MCP_CAPS")) + [{"name": "TESTRELIC_MCP_CAPS", "value": $CAPS}])' \
            /tmp/task-def.json > /tmp/task-def-updated.json

      - name: Register new task definition revision
        id: register-task
        run: |
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-def-updated.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task-def-arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER_NAME }}" \
            --service "${{ env.ECS_SERVICE_NAME }}" \
            --task-definition "${{ steps.register-task.outputs.task-def-arn }}"

      - name: Wait for stable deployment
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER_NAME }}" \
            --services "${{ env.ECS_SERVICE_NAME }}"

      - name: Health check
        # Retry for up to 3 minutes (12 × 15 s). Gives nginx time to register
        # the new container after ECS reports the service as stable.
        run: |
          MAX_ATTEMPTS=12
          SLEEP_SECS=15
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ env.INGRESS_HOST }}/healthz" --max-time 15)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed — HTTP $STATUS (attempt $i/$MAX_ATTEMPTS)"
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: HTTP $STATUS — waiting ${SLEEP_SECS}s..."
            sleep $SLEEP_SECS
          done
          echo "Health check failed after $MAX_ATTEMPTS attempts (last HTTP $STATUS)"
          exit 1

      - name: Client smoke check
        # /healthz is served from static config and answers 200 even when the
        # server is refusing every real client. On 2026-09-01 it reported
        # healthy through an outage in which 100% of clients got 403, because
        # the origin allow-list was built from the Host allow-list and could
        # only ever contain our own hostnames.
        #
        # So probe the way a CLIENT does, not the way a load balancer does: a
        # real POST /mcp initialize carrying an Origin header. curl sends no
        # Origin by default and the SDK skips the check when it is absent —
        # which is exactly why every manual probe looked fine.
        run: |
          BASE="https://${{ env.INGRESS_HOST }}"
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"deploy-smoke","version":"1"}}}'
          FAILED=0

          # A browser/Electron/webview origin must not be REJECTED. The test is
          # "not 403", not "is 200": once the auth gate is on, an unauthenticated
          # initialize correctly answers 401, and asserting 200 here would fail
          # the deploy for the wrong reason. The Host below is always correct on
          # these probes, so a 403 can only mean the Origin was refused.
          for ORIGIN in "https://claude.ai" "vscode-webview://smoke" "null"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -X POST "$BASE/mcp" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -H "Origin: $ORIGIN" -d "$INIT")
            case "$CODE" in
              403) echo "::error::Origin $ORIGIN -> 403 — the origin was refused; hosted clients cannot connect"; FAILED=1 ;;
              200|401) echo "ok   Origin $ORIGIN -> $CODE (origin accepted)" ;;
              *)   echo "::error::Origin $ORIGIN -> $CODE (unexpected)"; FAILED=1 ;;
            esac
          done

          # ...and DNS-rebinding protection must still reject a foreign Host.
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -X POST "$BASE/mcp" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Host: evil.example.com' -d "$INIT")
          if [ "$CODE" = "403" ]; then
            echo "ok   bogus Host -> 403"
          else
            echo "::error::bogus Host -> $CODE (expected 403) — rebinding protection is not enforcing"
            FAILED=1
          fi

          exit $FAILED
