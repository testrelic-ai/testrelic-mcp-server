name: Deploy Stage

on:
  push:
    branches: [stage]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ vars.MCP_ECR_REPOSITORY }}
  ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
  ECS_SERVICE_NAME: ${{ vars.STAGE_MCP_ECS_SERVICE }}
  ECS_TASK_FAMILY: ${{ vars.STAGE_MCP_TASK_FAMILY }}
  INGRESS_HOST: ${{ vars.STAGE_MCP_HOST }}
  # Capabilities the hosted stage server registers. The Dockerfile CMD passes no
  # --caps, so without this the server falls back to `core` ALONE and every gated
  # tool is silently absent from tools/list — stage cannot validate a fix it does
  # not expose (TEAI-375 shipped here without `creation`; TEAI-376 without
  # `signals`). Deliberately excludes ai/marketplace/apps/artifacts/memory: those
  # carry OAuth-connect and external side-effect surfaces a shared stage endpoint
  # should not expose by default. Kept literal rather than a repo variable so the
  # deployed surface is reviewable in the diff.
  MCP_CAPS: core,coverage,creation,healing,impact,triage,signals,devtools

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # 0a. Supply-chain guard
  # ───────────────────────────────────────────────────────────────────────
  # Stage deploys on every push, so whatever lands on the branch is built and
  # run with the stage AWS role. Nothing below may assume that role, build an
  # image or touch ECS until the guard
  # (testrelic-ai/supply-chain-guard, pinned by commit SHA) passes on the
  # pushed tree. The guard job itself gets a read-only token and no OIDC.
  guard:
    name: Supply-chain guard (deploy gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0              # commit-provenance needs the history
          persist-credentials: false  # no token left in .git/config
      - uses: testrelic-ai/supply-chain-guard@0560a2effa3db1886d952774b52639e940684f29 # v1
        with:
          mode: ${{ github.event_name == 'push' && 'push' || 'full' }}

  # ───────────────────────────────────────────────────────────────────────
  # 0b. Resolve environment
  # ───────────────────────────────────────────────────────────────────────
  resolve-environment:
    runs-on: ubuntu-latest
    needs: [guard]
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Set environment name
        id: set-env
        run: echo "environment=stage" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────
  # 1. Build & push MCP image to ECR
  # ───────────────────────────────────────────────────────────────────────
  build-and-push-image:
    runs-on: ubuntu-latest
    needs: [guard, resolve-environment]
    environment: ${{ needs.resolve-environment.outputs.environment }}
    outputs:
      image-tag: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.GH_ACTIONS_ROLE_ARN }}
          role-session-name: GitHubActionsMcpDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set image tag
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Build and push MCP image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/mcp/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:stage-latest

  # ───────────────────────────────────────────────────────────────────────
  # 2. Deploy to ECS
  # ───────────────────────────────────────────────────────────────────────
  deploy-mcp:
    runs-on: ubuntu-latest
    needs: [guard, resolve-environment, build-and-push-image]
    environment: ${{ needs.resolve-environment.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.GH_ACTIONS_ROLE_ARN }}
          role-session-name: GitHubActionsMcpEcsDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Render updated task definition
        id: render-task
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push-image.outputs.image-tag }}"

          aws ecs describe-task-definition \
            --task-definition "${{ env.ECS_TASK_FAMILY }}" \
            --query 'taskDefinition' > /tmp/task-def.json

          # Inject TESTRELIC_MCP_PUBLIC_HOSTS so the server's DNS-rebinding
          # allow-list accepts the CloudFront/nginx-forwarded public Host.
          # Without it the hosted endpoint 403s every POST /mcp (the 3.3.x
          # hardening). Idempotent: drop any prior value, then add the current
          # public host + its new.* preview alias.
          #
          # TESTRELIC_MCP_CAPS is injected the same way — see MCP_CAPS above for
          # why the default `core`-only surface is not good enough for stage.
          #
          # TESTRELIC_MCP_MULTI_TENANT must match prod. The auth gate turns
          # `requireAuth` on by default for a non-loopback bind but leaves
          # `multiTenant` OFF, and in single-tenant mode the gate compares the
          # caller's bearer against the server's OWN token — a secret no client
          # has. Stage exists to catch exactly that class of misconfiguration
          # before prod, so it has to run the same shape.
          jq --arg IMAGE "$IMAGE" --arg HOSTS "${{ env.INGRESS_HOST }},new.${{ env.INGRESS_HOST }}" --arg CAPS "${{ env.MCP_CAPS }}" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
             | .containerDefinitions[0].image = $IMAGE
             | .containerDefinitions[0].environment = ((.containerDefinitions[0].environment // []) | map(select(.name != "TESTRELIC_MCP_PUBLIC_HOSTS")) + [{"name": "TESTRELIC_MCP_PUBLIC_HOSTS", "value": $HOSTS}])
             | .containerDefinitions[0].environment = (.containerDefinitions[0].environment | map(select(.name != "TESTRELIC_MCP_CAPS")) + [{"name": "TESTRELIC_MCP_CAPS", "value": $CAPS}])
             | .containerDefinitions[0].environment = (.containerDefinitions[0].environment | map(select(.name != "TESTRELIC_MCP_MULTI_TENANT")) + [{"name": "TESTRELIC_MCP_MULTI_TENANT", "value": "true"}])' \
            /tmp/task-def.json > /tmp/task-def-updated.json

      - name: Register new task definition revision
        id: register-task
        run: |
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-def-updated.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task-def-arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER_NAME }}" \
            --service "${{ env.ECS_SERVICE_NAME }}" \
            --task-definition "${{ steps.register-task.outputs.task-def-arn }}"

      - name: Wait for stable deployment
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER_NAME }}" \
            --services "${{ env.ECS_SERVICE_NAME }}"

      - name: Health check
        # Retry for up to 3 minutes (12 × 15 s). Gives nginx time to register
        # the new container after ECS reports the service as stable.
        run: |
          MAX_ATTEMPTS=12
          SLEEP_SECS=15
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ env.INGRESS_HOST }}/healthz" --max-time 15)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed — HTTP $STATUS (attempt $i/$MAX_ATTEMPTS)"
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: HTTP $STATUS — waiting ${SLEEP_SECS}s..."
            sleep $SLEEP_SECS
          done
          echo "Health check failed after $MAX_ATTEMPTS attempts (last HTTP $STATUS)"
          exit 1
